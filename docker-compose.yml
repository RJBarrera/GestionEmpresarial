services:
  postgres:
    image: postgres:17-alpine
    container_name: gestion-empresarial-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gestion
      POSTGRES_PASSWORD: gestion
      POSTGRES_DB: gestion_empresa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gestion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestion -d gestion_empresa"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gestion_pgdata:
